# --- Global feeds toggle ---------------------------------------------------
include_remote_feeds: true

filters:
  # Title regexes, matched case-insensitively against the job title only.
  # A title must match at least one include AND zero excludes.
  include_titles:
    # SDE & General Software
    - '\b(sde|sde-?1|sde-?2|sde-?i|sde-?ii)\b'
    - '\b(software\s+development\s+engineer)\b'
    - '\b(software\s+engineer|software\s+developer)\b'
    - '\b(site\s+reliability\s+engineer|sre)\b'
    - '\b(backend|back\s*end)\b.*\b(engineer|developer)\b'
    - '\bapplication\s+developer\b'

    # AI / ML / GenAI roles
    - '\b(artificial\s+intelligence|ai)\b.*\b(engineer|scientist|researcher|developer)\b'
    - '\b(machine\s+learning|ml)\b.*\b(engineer|scientist|researcher|developer)\b'
    - '\b(deep\s+learning)\b.*\b(engineer|scientist|researcher)\b'
    - '\b(generative\s+ai|genai|gen-ai)\b.*\b(engineer|scientist|researcher|developer)\b'
    - '\bllm\b.*\b(engineer|scientist|researcher)\b'
    - '\bnlp\b.*\b(engineer|scientist|researcher)\b'
    - '\b(computer\s+vision)\b.*\b(engineer|scientist)\b'
    - '\bdata\s+scientist\b'
    - '\bml\s+engineer\b'
    - '\bai\s+engineer\b'
    - '\bmlops\b.*\b(engineer)\b'
    
    # Python / Java / Full Stack roles
    - '\bpython\b.*\b(developer|engineer)\b'
    - '\bjava\b.*\b(developer|engineer)\b'
    - '\bfull\s*stack\b.*\b(developer|engineer)\b'
    - '\bfullstack\b.*\b(developer|engineer)\b'
    - '\bfront\s*end\b.*\b(developer|engineer)\b'
    - '\bfrontend\b.*\b(developer|engineer)\b'
    
    # Data / SQL related roles
    - '\bdata\s+engineer\b'
    - '\bdata\s+developer\b'
    - '\b(etl|pipeline)\b.*\b(engineer|developer)\b'
    - '\bdatabase\b.*\b(engineer|developer)\b'
    - '\bsql\b.*\b(developer|engineer)\b'
    - '\b(big\s+data)\b.*\b(engineer|developer)\b'

  # Anything matching these is dropped even if an include matched.
  exclude_titles:
    - '\b(director|vp|vice president|head of|chief|cto)\b'
    - '\b(manager|management)\b'
    - '\b(staff|principal|lead\s+architect|distinguished)\b' # too senior
    - '\b(intern|internship|apprentice|trainee)\b'            # too junior
    - '\b(sales|account executive|marketing|recruit|support|success)\b'
    - '\b(ios|android|mobile|game)\b' # wrong discipline

  # Substrings matched against "<location> <title>", case-insensitive.
  # If allow_remote is true, all remote roles across the world automatically pass.
  locations:
    # --- Top Priority Tech Hubs ---
    - bengaluru
    - bangalore
    - hyderabad
    - mumbai
    - pune
    - gurgaon
    - gurugram
    - noida
    - delhi
    - new delhi
    - ncr
    - chennai
    - kolkata
    - ahmedabad

    # --- All States & Major Tech Cities across India ---
    - karnataka
    - telangana
    - maharashtra
    - tamil nadu
    - haryana
    - uttar pradesh
    - west bengal
    - gujarat
    - kerala
    - andhra pradesh
    - rajasthan
    - punjab
    - odisha
    - madhya pradesh
    - chandigarh
    - kochi
    - cochin
    - trivandrum
    - thiruvananthapuram
    - indore
    - jaipur
    - coimbatore
    - bhubaneswar
    - visakhapatnam
    - vizag
    - mysore
    - mysuru
    - nagpur
    - vadodara
    - surat
    - lucknow
    - kanpur
    - patna
    - bhopal
    - goa
    - dehradun
    - guwahati
    - india

  # If true, anything reading as remote (worldwide) passes the location gate.
  allow_remote: true

  # Drop postings older than this. Set to null to disable.
  # Boards often re-stamp `updated_at`, so this is a soft signal, not a promise.
  max_age_days: 30

# --- LLM stages -------------------------------------------------------------
screen_batch_size: 8      # jobs per screening call. Higher = cheaper, sloppier.
screen_jd_chars: 1400     # JD truncation for screening
draft_jd_chars: 6000      # JD truncation for drafting
score_threshold: 6.5      # below this, no draft and no digest slot
max_per_digest: 20        # up to 20 matched jobs per digest

# --- paths ------------------------------------------------------------------
companies_file: companies.yaml
profile_file: profile.json
seen_file: seen.json
digest_file: out/digest.html
tracker_csv: out/tracker.csv
