# --- Global feeds toggle ---------------------------------------------------
include_remote_feeds: true

filters:
  strict_fresher_filter: true
  # Title regexes, matched case-insensitively against the job title only.
  # A title must match at least one include AND zero excludes.
  include_titles:
    # SDE & General Software (Entry-Level / Fresher / SDE-1)
    - '\b(sde|sde-?1|sde-?i|junior\s+sde|associate\s+sde)\b'
    # Software / Backend / Full Stack
    - '\b(software\s+development\s+engineer|sde|swe)\b'
    - '\b(software\s+engineer|software\s+developer|application\s+developer|app\s+developer)\b'
    - '\b(associate\s+software\s+engineer|junior\s+software\s+engineer|graduate\s+software\s+engineer)\b'
    - '\b(backend|back[- ]end)\s+(engineer|developer|software\s+engineer)\b'
    - '\bfull[- ]?stack\b.*\b(engineer|developer|application\s+developer)\b'
    - '\bapi\s+(developer|engineer)\b'

    # Python & Java Specialist Roles
    - '\bpython\b.*\b(developer|engineer|backend\s+developer|software\s+engineer)\b'
    - '\bjava\b(?!\s*script).*\b(developer|engineer|software\s+engineer)\b'

    # Applied AI / Machine Learning / GenAI / LLM / Agentic
    - '\b(applied\s+)?(artificial\s+intelligence|ai)\b.*\b(engineer|developer|software\s+engineer|application\s+engineer|solutions\s+engineer)\b'
    - '\b(applied\s+)?(machine\s+learning|ml)\b.*\b(engineer|developer|software\s+engineer)\b'
    - '\b(generative\s+ai|genai|gen-ai)\b.*\b(engineer|developer|application\s+engineer)\b'
    - '\bllm\b.*\b(engineer|developer|application\s+engineer|application\s+developer)\b'
    - '\b(ai\s+agent|agentic\s+ai|ai\s+automation|ai\s+solutions|ai\s+workflow)\b.*\b(engineer|developer)\b'
    - '\bprompt\s+engineer\b'
    - '\bdeep\s+learning\b.*\b(engineer|developer)\b'

    # Computer Vision & Image Processing
    - '\b(computer\s+vision|vision\s+ai|image\s+processing)\b.*\b(engineer|developer|software\s+engineer|ml\s+engineer|ai\s+engineer)\b'

    # Database & Data Engineering
    - '\b(postgresql|sql|database)\s+(developer|engineer)\b'
    - '\b(data\s+engineer|junior\s+data\s+engineer|ai\s+data\s+engineer|ml\s+data\s+engineer)\b'
    - '\b(data\s+quality|data\s+processing|data\s+operations)\b.*\b(engineer|developer)\b'

    # Cloud / DevOps / SRE / QA & Testing
    - '\b(site\s+reliability\s+engineer|sre)\b'
    - '\b(cloud\s+software\s+engineer|software\s+engineer\s*-\s*cloud|junior\s+devops|devops\s+engineer)\b'
    - '\b(qa\s+automation|software\s+testing|automation\s+engineer|test\s+engineer)\b'
    - '\bdata\s+scientist\b'

    # MNC Entry-Level & Fresher Programs (TCS, Infosys, Wipro, Accenture, Cognizant, etc.)
    - '\b(graduate\s+engineer\s+trainee|get|trainee\s+engineer|associate\s+engineer|fresher\s+engineer|system\s+engineer\s+trainee)\b'
    - '\b(custom\s+software\s+engineer|custom\s+engineer|systems?\s+engineer|systems?\s+developer|programmer\s+analyst(\s+trainee)?)\b'
    - '\bentry\s*level\b.*\b(engineer|developer|software)\b'
    - '\bfresher\b'

  # Anything matching these is dropped even if an include matched.
  exclude_titles:
    - '\b(senior|sr\.?|principal|staff|lead|chief|head\s+of|director|vp|vice\s+president|distinguished|architect)\b' # too senior
    - '\b(sde[- ]?(?:2|3|4|5|ii|iii|iv|v)|software\s+engineer\s*(?:2|3|4|5|ii|iii|iv|v)|developer\s*(?:2|3|4|5|ii|iii|iv|v))\b' # experienced bands
    - '\b(mid[- ]?level|mid[- ]?senior|experienced|expert|specialist|consultant|senior\s+consultant|tech\s+lead|team\s+lead)\b' # experienced levels
    - '\b(manager|management|coordinator|executive\s+assistant)\b'
    - '\b(sales|account\s+executive|marketing|recruit|recruiter|customer\s+support|customer\s+success|business\s+development)\b'
    - '\b(ios|android|mobile|flutter|react\s+native|game\s+developer)\b' # wrong discipline
    - '\b(front\s*end|frontend)\b.*\b(developer|engineer)\b'             # focus on Full Stack / Backend / AI

  # Substrings matched against "<location> <title>", case-insensitive.
  # If allow_remote is true, all remote roles across the world automatically pass.
  locations:
    # --- Top Priority Tech Hubs ---
    - bengaluru
    - bangalore
    - hyderabad
    - mumbai
    - pune
    - gurgaon
    - gurugram
    - noida
    - delhi
    - new delhi
    - ncr
    - chennai
    - kolkata
    - ahmedabad

    # --- All States & Major Tech Cities across India ---
    - karnataka
    - telangana
    - maharashtra
    - tamil nadu
    - haryana
    - uttar pradesh
    - west bengal
    - gujarat
    - kerala
    - andhra pradesh
    - rajasthan
    - punjab
    - odisha
    - madhya pradesh
    - chandigarh
    - kochi
    - cochin
    - trivandrum
    - thiruvananthapuram
    - indore
    - jaipur
    - coimbatore
    - bhubaneswar
    - visakhapatnam
    - vizag
    - mysore
    - mysuru
    - nagpur
    - vadodara
    - surat
    - lucknow
    - kanpur
    - patna
    - bhopal
    - goa
    - dehradun
    - guwahati
    - india

  # If true, anything reading as remote (worldwide) passes the location gate.
  allow_remote: true

  # Drop postings older than 7 days (1 week maximum).
  max_age_days: 7

