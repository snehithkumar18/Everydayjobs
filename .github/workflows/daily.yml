name: daily job digest

on:
  schedule:
    # 06:00 IST & 18:00 IST every day. IST is UTC+5:30 -> 00:30 UTC and 12:30 UTC
    - cron: "30 0,12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip the email, just build the digest artifact"
        type: boolean
        default: false

# Two runs sharing one dedupe store would race. Queue them instead.
concurrency:
  group: jobhunt-daily
  cancel-in-progress: false

permissions:
  contents: read         # nothing is pushed back; the store lives in the cache

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Restore the dedupe store
        # seen.json is what stops you being emailed the same job twice, so it
        # has to survive between runs. It is NOT committed: it is personal, and
        # a seen.json in the repo would mark every job as seen for anyone who
        # clones it. Cache entries are immutable, so the key is unique per run
        # and restore-keys pulls the most recent one forward.
        uses: actions/cache@v4
        with:
          path: seen.json
          key: jobhunt-seen-${{ github.run_id }}
          restore-keys: |
            jobhunt-seen-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install LaTeX for PDF Resumes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-fonts-recommended texlive-latex-extra


      - name: Write profile.json
        # profile.json is gitignored (it is derived from your resume), so CI
        # gets it from a secret or falls back to profile.example.json.
        env:
          PROFILE_JSON: ${{ secrets.PROFILE_JSON }}
        run: |
          if [ -n "$PROFILE_JSON" ]; then
            printf '%s' "$PROFILE_JSON" > profile.json
          elif [ -f profile.example.json ]; then
            cp profile.example.json profile.json
          else
            echo "::error::No profile found — see the README"
            exit 1
          fi
          python -c "import json;json.load(open('profile.json'));print('profile.json parsed OK')"

      - name: Run the pipeline
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'groq' }}
          SCREEN_PROVIDER: ${{ vars.SCREEN_PROVIDER || 'groq' }}
          DRAFT_PROVIDER: ${{ vars.DRAFT_PROVIDER || 'groq' }}
          SCREEN_MODEL: ${{ vars.SCREEN_MODEL || 'openai/gpt-oss-20b' }}
          DRAFT_MODEL: ${{ vars.DRAFT_MODEL || 'openai/gpt-oss-120b' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER || 'snehithetsy@gmail.com' }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO || 'snehithetsy@gmail.com' }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m jobhunt run --limit 35
          else
            python -m jobhunt run --send --limit 35
          fi

      - name: Upload digest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_number }}
          path: out/
          retention-days: 14
          if-no-files-found: ignore

      - name: Report the dedupe store
        if: always()
        run: |
          if [ -f seen.json ]; then
            python -c "import json;print(f'tracking {len(json.load(open(\"seen.json\")))} postings')"
          else
            echo "no seen.json — first run, or the cache expired"
          fi
